<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Vehicles — manage and track all vehicles currently parked and recently exited."/>
    <title th:text="${pageTitle} + ' | Mall Parking Management'">Vehicles | Mall Parking Management</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='18' font-family='Arial' font-weight='900' fill='white'%3EP%3C/text%3E%3C/svg%3E"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: overlay}"></div>
<aside th:replace="~{fragments/layout :: sidebar(${currentPage})}"></aside>

<div class="main-wrapper">
    <header th:replace="~{fragments/layout :: topbar(${pageTitle})}"></header>

    <main class="page-content">
        <nav class="page-breadcrumb" aria-label="breadcrumb">
            <a th:href="@{/}"><i class="bi bi-house"></i> Home</a>
            <span class="sep"><i class="bi bi-chevron-right"></i></span>
            <span class="current" th:text="${pageTitle}">Vehicles</span>
        </nav>

        <!-- Summary cards -->
        <div class="summary-grid" style="grid-template-columns:repeat(4,1fr); margin-bottom:28px;">
            <div class="summary-card card-total animate-in">
                <div class="card-icon-wrap"><i class="bi bi-car-front-fill"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Currently Parked</div>
                    <div class="card-value" th:text="${totalParked}">312</div>
                    <div class="card-trend text-danger"><i class="bi bi-circle-fill" style="font-size:8px;"></i> Active now</div>
                </div>
            </div>
            <div class="summary-card card-available animate-in">
                <div class="card-icon-wrap"><i class="bi bi-box-arrow-up-right"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Exited Today</div>
                    <div class="card-value" th:text="${totalExited}">87</div>
                    <div class="card-trend text-success"><i class="bi bi-graph-down-arrow"></i> Departed</div>
                </div>
            </div>
            <div class="summary-card card-occupied animate-in">
                <div class="card-icon-wrap"><i class="bi bi-calendar-check-fill"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Total Today</div>
                    <div class="card-value" th:text="${carsToday}">187</div>
                    <div class="card-trend text-info"><i class="bi bi-graph-up"></i> Since midnight</div>
                </div>
            </div>
            <div class="summary-card card-occupancy animate-in">
                <div class="card-icon-wrap"><i class="bi bi-clock-history"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Avg Duration</div>
                    <div class="card-value" style="font-size:24px;" th:text="${avgDuration}">1h 42m</div>
                    <div class="card-trend"><i class="bi bi-info-circle"></i> Per vehicle</div>
                </div>
            </div>
        </div>

        <!-- Search bar -->
        <div class="panel mb-4" style="padding:14px 20px;">
            <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="section-title" style="margin:0;"><span class="title-icon"><i class="bi bi-search"></i></span> Search</div>
                <input id="vehicleSearch" type="text" class="form-control form-control-sm" style="width:260px;" placeholder="Vehicle number or driver name…"/>
                <select id="statusFilter" class="form-select form-select-sm" style="width:150px;">
                    <option value="">All Status</option>
                    <option value="PARKED">Parked</option>
                    <option value="EXITED">Exited</option>
                </select>
                <select id="floorFilter" class="form-select form-select-sm" style="width:150px;">
                    <option value="">All Floors</option>
                    <option value="B1">Basement 1</option>
                    <option value="B2">Basement 2</option>
                    <option value="GF">Ground Floor</option>
                </select>
            </div>
        </div>

        <!-- Vehicles table -->
        <div class="section-header">
            <h2 class="section-title">
                <span class="title-icon"><i class="bi bi-car-front-fill"></i></span>
                Vehicle Register
            </h2>
        </div>

        <div class="panel">
            <table id="vehiclesTable" class="table floor-table mb-0">
                <thead>
                    <tr>
                        <th>Vehicle No.</th>
                        <th>Driver</th>
                        <th class="text-center">Floor</th>
                        <th class="text-center">Slot</th>
                        <th>Entry Time</th>
                        <th class="text-center">Status</th>
                        <th class="text-end">Amount Due</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${vehicles}">
                        <td>
                            <span style="font-family:'Courier New',monospace;font-weight:700;font-size:13.5px;"
                                  th:text="${v['vehicleNo']}">MH12 AB 4521</span>
                        </td>
                        <td>
                            <div style="font-weight:600;font-size:13.5px;" th:text="${v['driver']}">Rahul Sharma</div>
                        </td>
                        <td class="text-center">
                            <span class="floor-code-badge" th:text="${v['floor']}">B1</span>
                        </td>
                        <td class="text-center">
                            <code style="font-size:12.5px;" th:text="${v['slot']}">B1-001</code>
                        </td>
                        <td th:text="${v['entryTime']}">08:14 AM</td>
                        <td class="text-center">
                            <span class="event-badge"
                                  th:classappend="${v['status'] == 'PARKED'} ? 'entry' : 'exit'"
                                  th:text="${v['status']}">PARKED</span>
                        </td>
                        <td class="text-end fw-700" th:text="${v['amountDue']}">₹130</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmMEJEzpVqSvjMsFHDUEEhiHk0dObFBMwRHk7KGBhPJYQCRQg" crossorigin="anonymous"></script>
<script th:src="@{/js/common.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const search  = document.getElementById('vehicleSearch');
    const status  = document.getElementById('statusFilter');
    const floor   = document.getElementById('floorFilter');
    function filter() {
        const q = search.value.toLowerCase();
        const s = status.value.toLowerCase();
        const f = floor.value.toLowerCase();
        document.querySelectorAll('#vehiclesTable tbody tr').forEach(row => {
            const t = row.textContent.toLowerCase();
            row.style.display = (!q || t.includes(q)) && (!s || t.includes(s)) && (!f || t.includes(f)) ? '' : 'none';
        });
    }
    search.addEventListener('input',   filter);
    status.addEventListener('change',  filter);
    floor.addEventListener('change',   filter);
});
</script>
</body>
</html>
