<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Floors — visual overview of each parking floor, slot capacity and real-time occupancy."/>
    <title th:text="${pageTitle} + ' | Mall Parking Management'">Floors | Mall Parking Management</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='18' font-family='Arial' font-weight='900' fill='white'%3EP%3C/text%3E%3C/svg%3E"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
    <style>
        .floor-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--border-radius); box-shadow:var(--card-shadow); overflow:hidden; transition:box-shadow var(--transition),transform var(--transition); }
        .floor-card:hover { box-shadow:var(--card-shadow-hover); transform:translateY(-2px); }
        .floor-card-header { padding:20px 24px 16px; border-bottom:1px solid var(--card-border); display:flex; align-items:center; justify-content:space-between; }
        .floor-card-body { padding:20px 24px; }
        .slot-grid { display:grid; grid-template-columns:repeat(15,1fr); gap:4px; margin-top:16px; }
        .slot-box { width:100%; aspect-ratio:1; border-radius:3px; transition:transform .15s; }
        .slot-box:hover { transform:scale(1.3); cursor:pointer; }
        .slot-occupied  { background:#ef4444; }
        .slot-available { background:#10b981; }
        .slot-reserved  { background:#f59e0b; }
        .floor-meta { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
        .floor-meta-item { text-align:center; padding:12px 8px; background:#f8fafc; border-radius:var(--border-radius-sm); }
        .floor-meta-label { font-size:10.5px; text-transform:uppercase; letter-spacing:.7px; color:var(--text-muted); font-weight:600; margin-bottom:4px; }
        .floor-meta-value { font-size:22px; font-weight:800; }
        .slot-legend { display:flex; gap:16px; margin-top:12px; flex-wrap:wrap; }
        .slot-legend-item { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-secondary); }
        .slot-legend-dot { width:12px; height:12px; border-radius:2px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/layout :: overlay}"></div>
<aside th:replace="~{fragments/layout :: sidebar(${currentPage})}"></aside>

<div class="main-wrapper">
    <header th:replace="~{fragments/layout :: topbar(${pageTitle})}"></header>

    <main class="page-content">
        <nav class="page-breadcrumb" aria-label="breadcrumb">
            <a th:href="@{/}"><i class="bi bi-house"></i> Home</a>
            <span class="sep"><i class="bi bi-chevron-right"></i></span>
            <span class="current" th:text="${pageTitle}">Floors</span>
        </nav>

        <div class="section-header mb-4">
            <h2 class="section-title"><span class="title-icon"><i class="bi bi-layers-fill"></i></span>Floor Map &amp; Occupancy</h2>
            <div class="slot-legend">
                <div class="slot-legend-item"><div class="slot-legend-dot" style="background:#ef4444;"></div>Occupied</div>
                <div class="slot-legend-item"><div class="slot-legend-dot" style="background:#10b981;"></div>Available</div>
                <div class="slot-legend-item"><div class="slot-legend-dot" style="background:#f59e0b;"></div>Reserved</div>
            </div>
        </div>

        <!-- One card per floor -->
        <div style="display:flex;flex-direction:column;gap:28px;">
            <div th:each="floor : ${floors}" class="floor-card">
                <div class="floor-card-header">
                    <div style="display:flex;align-items:center;gap:14px;">
                        <div class="floor-code-badge" style="width:48px;height:48px;font-size:14px;" th:text="${floor['code']}">B1</div>
                        <div>
                            <div style="font-size:16px;font-weight:700;" th:text="${floor['name']}">Basement Floor 1</div>
                            <div style="font-size:12px;color:var(--text-muted);">
                                <span th:text="${floor['rows']}">5</span> rows &times;
                                <span th:text="${floor['cols']}">30</span> slots per row
                            </div>
                        </div>
                    </div>
                    <span class="status-badge"
                          th:classappend="${#strings.toLowerCase(floor['status'])}"
                          th:text="${floor['status']}">FULL</span>
                </div>

                <div class="floor-card-body">
                    <!-- Meta stats -->
                    <div class="floor-meta">
                        <div class="floor-meta-item">
                            <div class="floor-meta-label">Total</div>
                            <div class="floor-meta-value" th:text="${floor['total']}">150</div>
                        </div>
                        <div class="floor-meta-item">
                            <div class="floor-meta-label">Occupied</div>
                            <div class="floor-meta-value text-danger" th:text="${floor['occupied']}">138</div>
                        </div>
                        <div class="floor-meta-item">
                            <div class="floor-meta-label">Available</div>
                            <div class="floor-meta-value text-success" th:text="${floor['available']}">12</div>
                        </div>
                    </div>

                    <!-- Occupancy bar -->
                    <div class="occ-bar-wrap" style="margin-top:16px;">
                        <div class="occ-bar-track" style="height:12px;">
                            <div class="occ-bar-fill"
                                 th:attr="data-pct=${floor['pct']}"
                                 style="width:0%;height:12px;"></div>
                        </div>
                        <span class="occ-pct fw-800" th:text="${floor['pct']} + '%'">92%</span>
                    </div>

                    <!-- Visual slot grid (simulated from occupancy %) -->
                    <div class="slot-grid" th:id="${'grid-' + floor['code']}"
                         th:attr="data-total=${floor['total']},data-occupied=${floor['occupied']}">
                        <!-- Filled by JS below -->
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmMEJEzpVqSvjMsFHDUEEhiHk0dObFBMwRHk7KGBhPJYQCRQg" crossorigin="anonymous"></script>
<script th:src="@{/js/common.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('.slot-grid').forEach(grid => {
        const total    = parseInt(grid.dataset.total)    || 0;
        const occupied = parseInt(grid.dataset.occupied) || 0;
        const reserved = Math.round(total * 0.03);
        const slots    = Array.from({ length: total }, (_, i) => {
            if (i < occupied - reserved) return 'occupied';
            if (i < occupied)            return 'reserved';
            return 'available';
        });
        // Shuffle for realistic-looking distribution
        slots.sort(() => Math.random() - 0.5);
        slots.forEach(type => {
            const box = document.createElement('div');
            box.className = `slot-box slot-${type}`;
            box.title = type.charAt(0).toUpperCase() + type.slice(1);
            grid.appendChild(box);
        });
    });
});
</script>
</body>
</html>
