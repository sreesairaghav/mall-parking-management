<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" content="Entry / Exit Log — full chronological log of all vehicle entry and exit events."/>
    <title th:text="${pageTitle} + ' | Mall Parking Management'">Entry / Exit Log | Mall Parking Management</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='18' font-family='Arial' font-weight='900' fill='white'%3EP%3C/text%3E%3C/svg%3E"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/layout :: overlay}"></div>
<aside th:replace="~{fragments/layout :: sidebar(${currentPage})}"></aside>

<div class="main-wrapper">
    <header th:replace="~{fragments/layout :: topbar(${pageTitle})}"></header>

    <main class="page-content">
        <nav class="page-breadcrumb" aria-label="breadcrumb">
            <a th:href="@{/}"><i class="bi bi-house"></i> Home</a>
            <span class="sep"><i class="bi bi-chevron-right"></i></span>
            <span class="current" th:text="${pageTitle}">Entry / Exit Log</span>
        </nav>

        <!-- Summary mini-cards -->
        <div class="summary-grid" style="grid-template-columns:repeat(3,1fr); margin-bottom:28px;">
            <div class="summary-card card-available animate-in">
                <div class="card-icon-wrap"><i class="bi bi-box-arrow-in-down-right"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Total Entries Today</div>
                    <div class="card-value" th:text="${totalEntries}">104</div>
                    <div class="card-trend text-success"><i class="bi bi-graph-up"></i> Since midnight</div>
                </div>
            </div>
            <div class="summary-card card-occupied animate-in">
                <div class="card-icon-wrap"><i class="bi bi-box-arrow-up-right"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Total Exits Today</div>
                    <div class="card-value" th:text="${totalExits}">87</div>
                    <div class="card-trend text-danger"><i class="bi bi-graph-down"></i> Departed</div>
                </div>
            </div>
            <div class="summary-card card-total animate-in">
                <div class="card-icon-wrap"><i class="bi bi-car-front-fill"></i></div>
                <div class="card-body-text">
                    <div class="card-label">Currently Inside</div>
                    <div class="card-value" th:text="${pendingInside}">312</div>
                    <div class="card-trend text-info"><i class="bi bi-circle-fill" style="font-size:8px;"></i> Active</div>
                </div>
            </div>
        </div>

        <!-- Filter bar -->
        <div class="panel mb-4" style="padding:14px 20px;">
            <div class="d-flex flex-wrap align-items-center gap-3">
                <div class="section-title" style="margin:0;"><span class="title-icon"><i class="bi bi-funnel-fill"></i></span> Filter Log</div>
                <select id="logEventFilter" class="form-select form-select-sm" style="width:150px;">
                    <option value="">All Events</option>
                    <option value="ENTRY">Entry</option>
                    <option value="EXIT">Exit</option>
                </select>
                <select id="logFloorFilter" class="form-select form-select-sm" style="width:150px;">
                    <option value="">All Floors</option>
                    <option value="B1">Basement 1</option>
                    <option value="B2">Basement 2</option>
                    <option value="GF">Ground Floor</option>
                </select>
                <input id="logSearch" type="text" class="form-control form-control-sm" style="width:220px;" placeholder="Vehicle no. or driver…"/>
            </div>
        </div>

        <!-- Activity log table -->
        <div class="section-header">
            <h2 class="section-title">
                <span class="title-icon"><i class="bi bi-activity"></i></span>
                Activity Log
            </h2>
        </div>

        <div class="panel">
            <table id="activityTable" class="table floor-table mb-0">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th class="text-center">Event</th>
                        <th>Vehicle No.</th>
                        <th>Driver</th>
                        <th class="text-center">Floor</th>
                        <th>Slot</th>
                        <th>Duration</th>
                        <th class="text-end">Amount</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="log : ${logs}">
                        <td><strong th:text="${log['time']}">10:52 AM</strong></td>
                        <td class="text-center">
                            <span class="event-badge"
                                  th:classappend="${log['event'] == 'ENTRY'} ? 'entry' : 'exit'"
                                  th:text="${log['event']}">ENTRY</span>
                        </td>
                        <td>
                            <span style="font-family:'Courier New',monospace;font-weight:700;"
                                  th:text="${log['vehicleNo']}">MH12 AB 4521</span>
                        </td>
                        <td th:text="${log['driver']}">Rahul Sharma</td>
                        <td class="text-center">
                            <span class="floor-code-badge" th:text="${log['floor']}">B1</span>
                        </td>
                        <td><code style="font-size:12.5px;" th:text="${log['slot']}">B1-038</code></td>
                        <td>
                            <span class="text-info fw-600"
                                  th:text="${log['duration'] != '-'} ? ${log['duration']} : '—'">—</span>
                        </td>
                        <td class="text-end fw-700"
                            th:text="${log['amount'] != '-'} ? ${log['amount']} : '—'">—</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmMEJEzpVqSvjMsFHDUEEhiHk0dObFBMwRHk7KGBhPJYQCRQg" crossorigin="anonymous"></script>
<script th:src="@{/js/common.js}"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const eventF = document.getElementById('logEventFilter');
    const floorF = document.getElementById('logFloorFilter');
    const search = document.getElementById('logSearch');
    function filter() {
        const e = eventF.value.toLowerCase();
        const f = floorF.value.toLowerCase();
        const q = search.value.toLowerCase();
        document.querySelectorAll('#activityTable tbody tr').forEach(row => {
            const t = row.textContent.toLowerCase();
            row.style.display = (!e || t.includes(e)) && (!f || t.includes(f)) && (!q || t.includes(q)) ? '' : 'none';
        });
    }
    eventF.addEventListener('change', filter);
    floorF.addEventListener('change', filter);
    search.addEventListener('input',  filter);
});
</script>
</body>
</html>
