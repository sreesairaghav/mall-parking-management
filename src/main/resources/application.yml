
spring:
  application:
    name: mall-parking-management

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mall_parking_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:YOUR_LOCAL_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

server:
  port: 8085

management:
  endpoint:
    health:
      probes:
        enabled: true
