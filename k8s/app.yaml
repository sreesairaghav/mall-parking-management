
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-parking-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-parking-app
  template:
    metadata:
      labels:
        app: mall-parking-app
    spec:
      containers:
        - name: mall-parking-app
          image: mallparkingacr1793939759.azurecr.io/mall-parking-app:v6
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/mallparking
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: mall-parking-service
spec:
  type: LoadBalancer
  selector:
    app: mall-parking-app
  ports:
    - port: 80
      targetPort: 8085
      protocol: TCP
  