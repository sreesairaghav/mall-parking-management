apiVersion: apps/v1
kind: Deployment
metadata:
  name: mall-parking-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mall-parking-app
  template:
    metadata:
      labels:
        app: mall-parking-app
    spec:
      containers:
        - name: mall-parking-app
          # Jenkins replaces main-latest with the exact build tag (main-vN) when it deploys
          image: mallparkingacr1793939759.azurecr.io/mall-parking-app:main-latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8085
          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/mallparking
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            # Let Java use 75% of the memory limit below (default is only 25%)
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
          # Give Spring Boot up to 3 minutes to start before the other checks begin
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 5
            failureThreshold: 36
          # Restart the container if the app stops responding
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 10
            failureThreshold: 3
          # Only send users to the pod when the app is ready
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
            periodSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: mall-parking-service
spec:
  type: LoadBalancer
  selector:
    app: mall-parking-app
  ports:
    - port: 80
      targetPort: 8085
      protocol: TCP
