# Template only. Do NOT put the real password in this file.
#
# Option 1 (recommended): create the Secret directly, nothing saved in Git:
#   kubectl create secret generic postgres-secret ^
#     --from-literal=POSTGRES_DB=mallparking ^
#     --from-literal=POSTGRES_USER=malladmin ^
#     --from-literal=POSTGRES_PASSWORD=<your-password>
#
# Option 2: copy this file to k8s/postgres-secret.yaml (ignored by Git),
#   fill in the password, then: kubectl apply -f k8s/postgres-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
type: Opaque
stringData:
  POSTGRES_DB: mallparking
  POSTGRES_USER: malladmin
  POSTGRES_PASSWORD: <your-password>
